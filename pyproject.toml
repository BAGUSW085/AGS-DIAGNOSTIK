[project]
name = "ags-diagnostik"
version = "1.1.0"
description = "AGOS SMART DIAGNOSTIK by Agos Corporation - Web App & AI Diagnostic Engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pypdf>=4.2.0",
]

[tool.vercel]
entrypoint = "main:app"
