name: Build Android APK - AGOS Smart Diagnostik

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: actions/subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter --version

      - name: Generate Android Platform Wrapper
        working-directory: frontend
        run: |
          if [ ! -d "android" ]; then
            echo "Generating Android platform wrapper..."
            flutter create . --org com.agos.smartdiagnostik --project-name bengkel_masa_depan
          fi

      - name: Install Flutter Dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Build Release APK
        working-directory: frontend
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: agos-smart-diagnostik-release-apk
          path: frontend/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
