name: Build Android APK Offline - AGOS Smart Diagnostik

on:
  workflow_dispatch:
  push:
    branches:
      - apk-offline

jobs:
  build-offline-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 (Export Data, Ikon APK & Verifikasi)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Build Helper (pydantic & pillow)
        run: python3 -m pip install --quiet pydantic pillow

      - name: Export Offline JSON Data, Sync Web & Bundle Local FontAwesome
        run: |
          python3 android_offline/tools/export_data.py
          python3 android_offline/tools/sync_web_to_offline.py
          mkdir -p android_offline/www/css android_offline/www/webfonts
          FA="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1"
          curl -sSL "$FA/css/all.min.css" -o android_offline/www/css/fontawesome.min.css
          curl -sSL "$FA/webfonts/fa-solid-900.woff2" -o android_offline/www/webfonts/fa-solid-900.woff2
          curl -sSL "$FA/webfonts/fa-regular-400.woff2" -o android_offline/www/webfonts/fa-regular-400.woff2
          curl -sSL "$FA/webfonts/fa-brands-400.woff2" -o android_offline/www/webfonts/fa-brands-400.woff2

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies, Build Tailwind CSS & Verify 100% True Offline Bundle
        working-directory: android_offline
        run: |
          npm install
          npx tailwindcss -i ./src/input.css -o ./www/css/app.css --minify
          test -s ./www/css/app.css
          test -s ./www/css/fontawesome.min.css
          grep -q 'href="css/app.css"' ./www/index.html
          grep -q 'href="css/fontawesome.min.css"' ./www/index.html
          ! grep -Eq 'cdn\.tailwindcss\.com|cdnjs\.cloudflare\.com|fonts\.googleapis\.com' ./www/index.html
          echo "=== VERIFIED 100% TRUE OFFLINE BUNDLE (ZERO CDN) ==="
          ls -lh ./www/css/app.css ./www/css/fontawesome.min.css ./www/index.html

      - name: Set up Java Development Kit (JDK 21 for Capacitor 6)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Generate & Sync Capacitor Android Project + Custom Logo Icon
        working-directory: android_offline
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          python3 tools/patch_android_project.py

      - name: Build Debug APK (Siap Pasang di HP)
        working-directory: android_offline/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../AGOS-Smart-Diagnostik-Offline.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: agos-diagnostik-offline-apk-v2.3.0
          path: android_offline/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish APK to GitHub Release (Direct Download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.3.0-offline
          name: "AGOS Smart Diagnostik v2.3.0 — APK Android 100% True Offline (Dark Cockpit JB420 · Zoom Mekanik Senior · 207 DTC 3-Tingkat)"
          body: "APK Android Full Offline v2.3.0 (Skripsi Dark Cockpit 3-Pilar Suzuki Grand Vitara JB420): 100% True Offline tanpa CDN/Internet (FIX total bug layar putih offline!), Zoom + Pinch-to-Zoom 2 Jari + Layar Penuh untuk Diagram Wiring, Penampang Soket Fisik & 57 Foto Wiring Asli OEM HD, Mode Teks Besar (A+) ramah mekanik senior, Format Sub-Bab terstruktur rapi untuk langkah SOP panjang, 207 Kode DTC JB420 lengkap 3-Tingkat Standar Pengukuran (Statis · Saat Idle · Nilai Scanner OBD-II), Simulasi Alur Sirkuit Terpadu + Mini-Oscilloscope + Uji Putus Kabel, serta Weighted CBR & SheetJS Excel offline."
          files: android_offline/AGOS-Smart-Diagnostik-Offline.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
